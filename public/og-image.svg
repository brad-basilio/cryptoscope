<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Precision Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Subtle center glow -->
  <circle cx="600" cy="315" r="320" fill="#ffffff" fill-opacity="0.02"/>

  <!-- Logo Scope White Icon (Center-Left) -->
  <g transform="translate(100, 185)">
    <rect width="130" height="130" rx="32" fill="#18181b" stroke="#3f3f46" stroke-width="2.5"/>
    <circle cx="65" cy="65" r="46" stroke="#52525b" stroke-width="2.5" fill="none"/>
    <circle cx="65" cy="65" r="32" stroke="#a1a1aa" stroke-width="3" fill="none" stroke-dasharray="8 4"/>
    <circle cx="65" cy="65" r="18" stroke="#ffffff" stroke-width="3.5" fill="none"/>
    <line x1="65" y1="10" x2="65" y2="28" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="102" x2="65" y2="120" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="65" x2="28" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="102" y1="65" x2="120" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="65" cy="65" r="7" fill="#ffffff"/>
  </g>

  <!-- Typography & Copy -->
  <g transform="translate(260, 235)">
    <!-- Brand Name + Pro Tag -->
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">CryptoScope</text>
    <rect x="385" y="-46" width="68" height="34" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="419" y="-23" fill="#ffffff" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">PRO</text>
    
    <!-- Subtitle -->
    <text x="0" y="52" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.5">Institutional-Grade Crypto Screener &amp; Risk Intelligence Workstation</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(100, 395)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="230" height="52" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="25" y="32" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600">🐋 DEX Whale Tape</text>

    <!-- Badge 2 -->
    <rect x="250" y="0" width="230" height="52" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="275" y="32" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600">🛡️ HHI Risk Engine</text>

    <!-- Badge 3 -->
    <rect x="500" y="0" width="240" height="52" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="525" y="32" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600">🔔 Autonomous TP/SL</text>

    <!-- Badge 4 -->
    <rect x="760" y="0" width="240" height="52" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <text x="785" y="32" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600">🌐 Global Macro Pulse</text>
  </g>

  <!-- Bottom Hackathon Attribution Bar -->
  <g transform="translate(100, 560)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#27272a" stroke-width="1"/>
    <text x="0" y="35" fill="#71717a" font-family="monospace" font-size="15" font-weight="500">Built for Build with CMC: API Hackathon 2026 · Powered by CoinMarketCap Pro API</text>
    <text x="1000" y="35" fill="#a1a1aa" font-family="monospace" font-size="15" font-weight="600" text-anchor="end">Laravel 12 + Inertia.js</text>
  </g>
</svg>