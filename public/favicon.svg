<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Solid Dark Matte Base -->
  <rect width="64" height="64" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  <!-- Outer Subtle Radar Circle -->
  <circle cx="32" cy="32" r="22" stroke="#3f3f46" stroke-width="1.5" fill="none"/>
  <!-- Middle Dashed Precision Circle -->
  <circle cx="32" cy="32" r="15" stroke="#71717a" stroke-width="1.8" fill="none" stroke-dasharray="3.5 2"/>
  <!-- Inner Pure White Ring -->
  <circle cx="32" cy="32" r="8" stroke="#ffffff" stroke-width="2" fill="none"/>
  <!-- White Scope Crosshairs -->
  <line x1="32" y1="5" x2="32" y2="13" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="59" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="13" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="59" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Solid White Center Focal Target -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
</svg>